name: ci-release

on:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Syntax check
        run: bash -n ratsweepr.sh
      - name: No process substitution / dev-fd dependence (CageFS hosts have no /dev/fd)
        run: make check-nofd
      - name: cache_age_secs smoke test (catches GNU-vs-BSD stat bugs)
        run: |
          awk '/^cache_age_secs\(\) \{/,/^\}/' ratsweepr.sh > /tmp/cas.sh
          source /tmp/cas.sh
          fail=0

          touch /tmp/fresh.txt
          age="$(cache_age_secs /tmp/fresh.txt 2>/tmp/err.log)"
          [ -s /tmp/err.log ] && { echo "::error::stderr on fresh file:"; cat /tmp/err.log; fail=1; }
          case "$age" in ''|*[!0-9]*) echo "::error::fresh age not numeric: '$age'"; fail=1;; esac
          [ -n "$age" ] && [ "$age" -lt 5 ] 2>/dev/null || { echo "::error::fresh age not < 5: '$age'"; fail=1; }

          touch -d "2 days ago" /tmp/stale.txt
          age="$(cache_age_secs /tmp/stale.txt 2>/tmp/err.log)"
          [ -s /tmp/err.log ] && { echo "::error::stderr on stale file:"; cat /tmp/err.log; fail=1; }
          case "$age" in ''|*[!0-9]*) echo "::error::stale age not numeric: '$age'"; fail=1;; esac
          [ -n "$age" ] && [ "$age" -gt 172000 ] && [ "$age" -lt 173600 ] 2>/dev/null \
              || { echo "::error::stale age not ~172800: '$age'"; fail=1; }

          rm -f /tmp/missing.txt
          age="$(cache_age_secs /tmp/missing.txt 2>/tmp/err.log)"
          [ -s /tmp/err.log ] && { echo "::error::stderr on missing file:"; cat /tmp/err.log; fail=1; }
          [ "$age" = "999999" ] || { echo "::error::missing age != 999999: '$age'"; fail=1; }

          [ "$fail" = "0" ] && echo "cache_age_secs smoke test OK" || exit 1
      - name: ratsweepr.yar matches the bundled heredoc
        run: make yara-sync
      - name: Tag mirrors RS_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="$(grep '^RS_VERSION=' ratsweepr.sh | cut -d'"' -f2)"
          [ "v$ver" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$ver"; exit 1; }
      - name: Validate YARA ruleset compiles
        run: |
          ver=v1.19.0
          url="https://github.com/VirusTotal/yara-x/releases/download/$ver/yara-x-$ver-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" | tar -xz yr && chmod +x yr
          ./yr scan ratsweepr.yar /dev/null && echo "rules compile OK"

  release:
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Checksums
        run: sha256sum ratsweepr.sh ratsweepr.yar ratsweepr-sigs.conf install.sh > SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ratsweepr.sh
            ratsweepr.yar
            ratsweepr-sigs.conf
            install.sh
            SHA256SUMS
          generate_release_notes: true
